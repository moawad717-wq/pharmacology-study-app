<style>:root{--bg:#f6f8fa;--card:#fff;--ink:#0f172a;--mut:#64748b;--p:#0f766e;--p2:#14b8a6;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:760px;margin:0 auto;padding:16px 14px 80px;padding-top:max(16px,env(safe-area-inset-top))}
a{color:inherit;text-decoration:none}
.hero{background:linear-gradient(135deg,#0f766e,#0e7490);color:#fff;border-radius:22px;padding:24px 20px;margin-bottom:14px}
.hero h1{margin:6px 0 4px;font-size:34px}.hero p{margin:0 0 14px;opacity:.92}.pill{display:inline-block;background:rgba(255,255,255,.18);border-radius:99px;padding:3px 12px;font-size:13px}
.stat{display:flex;gap:10px}.stat div{flex:1;background:rgba(255,255,255,.15);border-radius:14px;padding:8px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:12px;opacity:.9}
.search input{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:14px;font-size:16px;background:#fff}
#res a{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:6px}#res small{display:block;color:var(--mut)}.empty{color:var(--mut);font-size:14px}
.part{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:12px 0;overflow:hidden}
.part summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;font-weight:700}.part summary::-webkit-details-marker{display:none}
.pn{background:var(--p);color:#fff;border-radius:10px;padding:2px 10px;font-size:13px;white-space:nowrap}.pt small{display:block;color:var(--mut);font-weight:400;font-size:13px;direction:rtl;text-align:left}
.chrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}.chrow:active{background:#f0fdfa}
.num{width:30px;height:30px;border-radius:50%;background:#ccfbf1;color:var(--p);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.nm{flex:1;line-height:1.35}.nm small{display:block;color:var(--mut);font-size:12px}.go{color:var(--p);font-size:24px}.ck{color:#16a34a;font-weight:800}.tag{font-size:11px;background:#f1f5f9;color:var(--mut);padding:2px 8px;border-radius:99px}
.soon .num{background:#f1f5f9;color:var(--mut)}.soon .nm{color:#475569}
.note{font-size:13px;color:var(--mut);margin-top:22px}
.back{display:inline-block;margin:4px 0 8px;color:var(--p);font-weight:600}
.chead span{color:var(--mut);font-size:13px}.chead h1{margin:2px 0 10px;font-size:28px;line-height:1.2}
.lead{font-size:17px;background:#ecfeff;border-left:4px solid var(--p2);padding:12px 14px;border-radius:10px}
h2{font-size:21px;margin:26px 0 8px;color:#0f766e}p{margin:10px 0}
figure{margin:16px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px}figure{overflow-x:auto}figure svg{width:100%;min-width:500px;height:auto;display:block}figcaption{text-align:center;color:var(--mut);font-size:13px;margin-top:4px}
.box{border-radius:14px;padding:12px 14px;margin:14px 0}.box b{display:block;margin-bottom:2px}
.tip{background:#eff6ff;border:1px solid #bfdbfe}.mn{background:#fffbeb;border:1px solid #fde68a}.ar{background:#f5f3ff;border:1px solid #ddd6fe;font-size:17px;line-height:1.9}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:14px;background:#fff}table{border-collapse:collapse;width:100%;font-size:14px}th{background:#f0fdfa;color:var(--p);text-align:left}th,td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border:0}
.drugs{display:grid;gap:10px;margin:12px 0}.drug{background:#fff;border:1px solid var(--line);border-left:5px solid var(--p2);border-radius:14px;padding:10px 14px}
.dn{font-weight:700;font-size:16px;color:var(--p)}.dc{display:inline-block;background:#f0fdfa;color:#115e59;font-size:12px;border-radius:99px;padding:1px 10px;margin:3px 0}.du{font-size:14px}.dx{font-size:13px;color:var(--mut)}
.qh{margin-top:34px}.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}.q p{margin:0 0 8px}
.q button{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:1px solid var(--line);background:#f8fafc;border-radius:10px;font-size:15px;color:var(--ink)}
.q button.ok{background:#dcfce7;border-color:#16a34a}.q button.bad{background:#fee2e2;border-color:#dc2626}.ex{font-size:14px;color:#334155;margin-top:4px}
.score{font-weight:700;color:var(--p);margin:8px 2px}
.donebtn{display:block;width:100%;margin-top:18px;padding:14px;border-radius:14px;border:0;background:var(--p);color:#fff;font-size:16px;font-weight:700}.donebtn.on{background:#16a34a}
.navrow{display:flex;justify-content:space-between;margin-top:18px}.nav{background:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:600;color:var(--p)}
.soonbox{text-align:center;background:#fff;border:1px dashed #94a3b8;border-radius:18px;padding:28px 18px;margin-top:10px}.big{font-size:44px}
@media(min-width:700px){td::before{content:none}}
</style></head><body><div id="app"></div><script>// ---------- helpers for diagrams ----------
const C={teal:'#0f766e',blue:'#2563eb',red:'#dc2626',amber:'#d97706',purple:'#7c3aed',green:'#16a34a',gray:'#64748b',ink:'#0f172a'};
function box(x,y,w,h,t,c,sub){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${c}" opacity=".12" stroke="${c}" stroke-width="2"/><text x="${x+w/2}" y="${y+h/2+(sub?-4:5)}" text-anchor="middle" font-size="15" font-weight="700" fill="${c}">${t}</text>${sub?`<text x="${x+w/2}" y="${y+h/2+14}" text-anchor="middle" font-size="11" fill="${C.gray}">${sub}</text>`:''}`}
function arrow(x1,y1,x2,y2,c){c=c||C.gray;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="2.5" marker-end="url(#ah)"/>`}
function svg(w,h,inner){return `<svg viewBox="0 0 ${w} ${h}" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>${inner}</svg>`}
function txt(x,y,t,o){o=o||{};return `<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" font-size="${o.s||12}" font-weight="${o.w||400}" fill="${o.c||C.ink}">${t}</text>`}

 box(420,55,100,60,'Metabolism',C.amber,'mostly liver')+arrow(520,85,545,85)+
 box(545,55,85,60,'Excretion',C.red,'kidney, bile')+
 txt(195,38,'A',{s:22,w:800,c:C.blue})+txt(335,38,'D',{s:22,w:800,c:C.teal})+txt(470,38,'M',{s:22,w:800,c:C.amber})+txt(587,38,'E',{s:22,w:800,c:C.red})+

 `<path d="M60 250 C100 80 140 50 170 50 C260 55 360 150 520 225" fill="none" stroke="${C.teal}" stroke-width="4"/>`+
 `<line x1="60" y1="50" x2="170" y2="50" stroke="${C.red}" stroke-dasharray="5 4"/><circle cx="170" cy="50" r="6" fill="${C.red}"/>`+
 txt(190,40,'Cmax (peak)',{a:'start',c:C.red,w:700})+
 `<line x1="60" y1="200" x2="530" y2="200" stroke="${C.amber}" stroke-dasharray="6 4"/>`+txt(535,196,'MEC',{a:'end',c:C.amber,w:700})+
 txt(300,290,'Time',{w:700})+`<text transform="translate(18,150) rotate(-90)" text-anchor="middle" font-size="12" font-weight="700">Plasma concentration</text>`+
 txt(170,270,'Tmax',{c:C.red})+txt(120,175,'Onset',{c:C.gray})+txt(430,120,'Elimination phase',{c:C.teal,w:700})+

CH[1]={intro:'Pharmacokinetics is the story of a drug\'s journey: how it gets in, where it goes, how the body changes it and how it leaves. Think of a parcel delivery: pickup, route, repackaging, and drop-off out of the system.',
blocks:[
['svg','adme','The four steps of ADME'],
['h','1. Absorption: getting into the blood'],
['p','Routes decide speed and amount. <b>Bioavailability (F)</b> is the fraction of the dose that reaches the systemic circulation unchanged. IV = 100% by definition.'],
['table',['Route','Key points','Examples'],[
 ['Oral','Most convenient; affected by food, pH, <b>first-pass metabolism</b>','Amoxicillin tablets, metformin'],
 ['Intravenous (IV)','100% bioavailable, fastest, no absorption step','Vancomycin, heparin infusion'],
 ['Intramuscular (IM)','Fairly fast; depot injections last long','Ceftriaxone, haloperidol decanoate'],
 ['Subcutaneous (SC)','Slower, steady; good for peptides','Insulin, enoxaparin'],
 ['Sublingual','Skips first-pass; very rapid','Nitroglycerin'],
 ['Transdermal','Slow, steady plasma level over days','Nicotine patch, fentanyl patch'],
 ['Inhalation','Fast to lungs; small systemic dose','Salbutamol, budesonide'],
 ['Rectal','Partial first-pass bypass; useful if vomiting','Diazepam gel, paracetamol suppository']]],
['p','<b>First-pass effect:</b> after oral dosing, blood from the gut goes to the liver first, which can destroy part of the dose before it reaches the body. High first-pass drugs: <b>propranolol, lidocaine, morphine, nitroglycerin</b>. That is why nitroglycerin is given under the tongue.'],
['h','Crossing membranes'],
['p','Most drugs cross by <b>passive diffusion</b> (high to low concentration, lipid-soluble and unionised form crosses best). Other mechanisms: facilitated diffusion, <b>active transport</b> (needs energy, e.g. P-glycoprotein pumps), and endocytosis.'],
['p','<b>Weak acids</b> (aspirin, phenobarbital) are unionised, and absorbed, in acidic stomach fluid. <b>Weak bases</b> (amphetamine, morphine) are better absorbed in the intestine. In overdose, changing urine pH traps the drug in urine: alkalinise urine with sodium bicarbonate for aspirin or phenobarbital.'],
['ar','ملحوظة: الدواء بيعدي الأغشية وهو في الصورة غير المتأينة. الحمض الضعيف بيتأين في الوسط القلوي، فبنقلّل البول حمضية لإخراج الأسبرين بسرعة.'],
['h','2. Distribution: where the drug goes'],
['p','<b>Volume of distribution (Vd)</b> = dose ÷ initial plasma concentration. It is an apparent volume, not a real one. A big Vd (chloroquine, digoxin) means the drug leaves blood for tissues. A small Vd (warfarin, heparin) means it stays in plasma, mostly protein-bound.'],
['p','Only the <b>free</b> (unbound) drug is active. Warfarin is about 99% bound to albumin, so a displacing drug can suddenly raise the free fraction. The <b>blood-brain barrier</b> lets in lipid-soluble drugs only; inflamed meninges let in more antibiotic.'],
['h','3. Metabolism: changing the drug'],
['p','Mainly in the liver. <b>Phase I</b> (oxidation, reduction, hydrolysis, via <b>cytochrome P450</b>) makes a drug slightly more polar. <b>Phase II</b> (conjugation: glucuronidation, sulfation, acetylation) makes it water-soluble for excretion. A <b>prodrug</b> needs metabolism to become active (e.g. codeine to morphine, enalapril to enalaprilat).'],
['drugs',[
 ['Rifampicin, carbamazepine, phenytoin, phenobarbital, St John\'s wort','CYP450 INDUCERS','Faster metabolism of other drugs','Can fail warfarin, OCPs, many others'],
 ['Cimetidine, ketoconazole, erythromycin, clarithromycin, ciprofloxacin, ritonavir, grapefruit juice','CYP450 INHIBITORS','Slower metabolism of other drugs','Can cause toxicity of warfarin, statins, theophylline']]],
['mn','Inducers: <b>CRAP GPS</b> (Carbamazepine, Rifampin, Alcohol chronic, Phenytoin, Griseofulvin, Phenobarbital, St John\'s wort). Inhibitors: <b>SICKFACES.COM</b> (Sodium valproate, Isoniazid, Cimetidine, Ketoconazole, Fluconazole, Alcohol acute, Chloramphenicol, Erythromycin, Sulfonamides, Ciprofloxacin, Omeprazole, Metronidazole).'],
['h','4. Excretion: leaving the body'],
['p','Mostly <b>renal</b> (filtration, active secretion, reabsorption), also bile, breath, sweat and milk. <b>Clearance (CL)</b> is the volume of plasma cleared per unit time. In kidney disease, doses of renally cleared drugs (gentamicin, vancomycin, digoxin) must be reduced.'],
['svg','curve','Plasma level after an oral dose'],
['p','<b>Half-life</b> t½ = 0.693 × Vd ÷ CL. After about <b>4 to 5 half-lives</b> a drug is nearly gone, and with repeated dosing it reaches <b>steady state</b> in the same time. A <b>loading dose</b> gets there faster (depends on Vd); a <b>maintenance dose</b> keeps it there (depends on CL).'],
['svg','half','Half-life: first-order elimination'],
['p','<b>First-order</b> kinetics: a constant fraction is removed per hour (most drugs). <b>Zero-order</b>: a constant amount per hour because enzymes are saturated. Remember <b>PEA</b>: Phenytoin, Ethanol, Aspirin (high dose).'],
['tip','Therapeutic drug monitoring is used for narrow-window drugs: digoxin, lithium, aminoglycosides, vancomycin, phenytoin, theophylline.'],
['ar','ملحوظة: نصف العمر الحيوي (t½) هو الوقت اللازم لنقص تركيز الدواء للنصف. بعد 4-5 نصف عمر يصل الدواء لحالة الاستقرار أو يختفي تقريباً.']],
q:[
['Which route avoids first-pass metabolism?',['Oral','Sublingual','None of them','Gastric tube'],1,'The sublingual route drains into the systemic veins, not the portal vein.'],
['A drug has a very large volume of distribution. What does that mean?',['It stays in plasma','It is concentrated in tissues','It is cleared quickly','It is always protein bound'],1,'A large apparent Vd means the drug leaves plasma and sits in tissues.'],
['How many half-lives are needed to reach steady state (roughly)?',['1','2','4 to 5','10'],2,'About 94 to 97% of steady state is reached after 4 to 5 half-lives.'],
['Which drug is a CYP450 inducer?',['Cimetidine','Ketoconazole','Rifampicin','Ciprofloxacin'],2,'Rifampicin induces CYP450 and lowers levels of many other drugs.'],
['Which drugs follow zero-order kinetics at high dose?',['Penicillin and amoxicillin','Phenytoin, ethanol, aspirin','Atenolol','Digoxin'],1,'PEA: Phenytoin, Ethanol, Aspirin.']]};

CH[2]={intro:'Pharmacodynamics is what the drug does to the body: how it binds a target, what happens next and how strong the effect is. If pharmacokinetics is the journey, pharmacodynamics is what the drug does on arrival.',
blocks:[
['svg','receptor','Agonist versus antagonist'],
['h','Types of drug action at receptors'],
['table',['Type','What it does','Example'],[
 ['Full agonist','Binds and gives maximal response','Morphine at mu receptors'],
 ['Partial agonist','Binds, gives a smaller maximal response; can block full agonists','Buprenorphine'],
 ['Competitive antagonist','Reversible; more agonist can overcome it (shifts curve right)','Naloxone vs morphine, atropine vs ACh'],
 ['Non-competitive / irreversible antagonist','Cannot be overcome; lowers the maximum','Phenoxybenzamine'],
 ['Inverse agonist','Lowers activity below the baseline','Some antihistamines (H1)'],
 ['Physiological antagonist','Different receptors, opposite effects','Adrenaline vs histamine in anaphylaxis']]],
['svg','dose','Dose-response curves'],
['h','Potency and efficacy'],
['p','<b>Potency</b> is how much drug is needed (position of the curve, EC50). <b>Efficacy</b> is the maximal effect (height of the curve). A drug can be less potent but just as efficacious, and efficacy matters more clinically.'],
['p','<b>Therapeutic index</b> = TD50 ÷ ED50 (or LD50 ÷ ED50). A narrow index means a small gap between effective and toxic dose: warfarin, digoxin, lithium, phenytoin, theophylline, aminoglycosides.'],
['h','Receptor families'],
['table',['Family','Speed','Examples'],[
 ['Ligand-gated ion channels','Milliseconds','Nicotinic (N), GABA-A, NMDA'],
 ['G-protein coupled receptors','Seconds','Muscarinic, adrenergic, opioid'],
 ['Enzyme-linked receptors','Minutes','Insulin (tyrosine kinase)'],
 ['Intracellular receptors','Hours to days','Steroids, thyroid hormone']]],
['mn','G-proteins: <b>Gs</b> raises cAMP (β1, β2, D1), <b>Gi</b> lowers cAMP (α2, M2, D2), <b>Gq</b> raises IP3/DAG/Ca²⁺ (α1, M1, M3). "Q-sin" = Gq: α1, M1, M3, H1.'],
['h','Changes in response over time'],
['p','<b>Tolerance</b> develops over days to weeks (opioids, nitrates). <b>Tachyphylaxis</b> is a rapid fall in response after repeated doses (ephedrine). <b>Up-regulation</b> of receptors follows chronic blockade (β-blocker withdrawal gives rebound), and down-regulation follows chronic stimulation.'],
['ar','ملحوظة: القوة (potency) = كمية الدواء المطلوبة. الفعالية (efficacy) = أقصى تأثير. المضاد التنافسي ممكن نتغلب عليه بزيادة الجرعة، لكن غير التنافسي لا.']],
q:[
['Which agent lowers the maximum response and cannot be overcome by more agonist?',['Competitive antagonist','Non-competitive antagonist','Partial agonist','Full agonist'],1,'Non-competitive antagonists reduce Emax.'],
['A narrow therapeutic index drug is:',['Penicillin','Digoxin','Amoxicillin','Paracetamol at normal dose'],1,'Digoxin has a very small gap between therapeutic and toxic levels.'],
['Gq coupled receptors raise:',['cAMP','IP3 and DAG','cGMP','Nothing'],1,'Gq activates phospholipase C, producing IP3 and DAG.'],
['Naloxone reversing morphine is an example of:',['Physiological antagonism','Competitive antagonism','Synergism','Tachyphylaxis'],1,'Naloxone competes at the same opioid receptor.'],
['Which has the slowest onset?',['Ion channel','GPCR','Enzyme-linked receptor','Intracellular (steroid) receptor'],3,'Steroid receptors change gene transcription, taking hours to days.']]};

CH[3]={intro:'The autonomic nervous system (ANS) runs the body without you thinking: heart rate, pupils, digestion, bladder. Two teams pull in opposite directions: sympathetic (fight or flight) and parasympathetic (rest and digest).',
blocks:[
['svg','ans','Pre- and postganglionic neurons'],
['h','Neurotransmitters'],
['p','<b>Acetylcholine (ACh)</b> acts at all ganglia, at parasympathetic targets and at the neuromuscular junction (somatic). <b>Norepinephrine (NE)</b> acts at most sympathetic targets. The adrenal medulla releases mostly <b>epinephrine</b> into blood.'],
['h','Receptors and what they do'],
['table',['Receptor','Where','Effect when stimulated'],[
 ['Nicotinic N(N)','Ganglia','Ganglionic transmission'],
 ['Nicotinic N(M)','Skeletal muscle','Contraction'],
 ['M1','CNS, gastric parietal cells','Cognition, acid secretion'],
 ['M2','Heart','Slower heart rate'],
 ['M3','Smooth muscle, glands, eye','Contraction, secretion, miosis, bronchoconstriction'],
 ['α1','Vessels, eye (dilator), prostate','Vasoconstriction, mydriasis, urinary sphincter contraction'],
 ['α2','Presynaptic nerve terminals','Less NE released (negative feedback)'],
 ['β1','Heart, kidney (JG cells)','Faster rate, stronger contraction, renin release'],
 ['β2','Bronchi, skeletal muscle vessels, uterus','Bronchodilation, vasodilation, uterine relaxation'],
 ['β3','Fat, bladder','Lipolysis, bladder relaxation'],
 ['D1','Renal vessels','Vasodilation']]],
['mn','Parasympathetic overload = <b>SLUDGE</b>: Salivation, Lacrimation, Urination, Defecation, GI upset, Emesis. Sympathetic = <b>fight, flight, fright and sex</b> (E for emission).'],
['tip','Drugs work by changing one of five steps: synthesis, storage, release, receptor action, or breakdown or reuptake of the transmitter. The next chapters follow this logic.'],
['ar','ملحوظة: الباراسمبثاوي ألياف ما قبل العقدة طويلة وبعدها قصيرة، والسمبثاوي العكس. الأستيل كولين هو الناقل في كل العقد العصبية.']],
q:[
['Which neurotransmitter acts at all autonomic ganglia?',['Norepinephrine','Acetylcholine','Dopamine','Serotonin'],1,'ACh acts on Nn receptors in both sympathetic and parasympathetic ganglia.'],
['Stimulation of M3 receptors causes:',['Bronchodilation','Mydriasis','Bronchoconstriction and secretions','Tachycardia'],2,'M3: smooth muscle contraction and gland secretion.'],
['Which receptor causes bronchodilation?',['α1','β1','β2','M3'],2,'β2 agonists such as salbutamol relax bronchial smooth muscle.'],
['Sweat glands in the sympathetic system use:',['NE on α1','ACh on muscarinic','Epinephrine','Dopamine'],1,'An exception: sympathetic cholinergic fibres.'],
['Presynaptic α2 stimulation leads to:',['More NE release','Less NE release','Heart rate increase','Bronchodilation'],1,'α2 is a negative feedback brake on NE release.']]};

CH[4]={intro:'Cholinergic agonists mimic acetylcholine. Some bind the receptor directly. Others block acetylcholinesterase (AChE) so ACh builds up.',
blocks:[
['svg','syn','The cholinergic synapse'],
['h','Direct-acting agonists'],
['drugs',[
 ['Bethanechol','Muscarinic agonist','Urinary retention (post-op, neurogenic bladder), GI atony','Not broken down by AChE; no nicotinic effect'],
 ['Pilocarpine','Muscarinic agonist','Glaucoma (miosis), dry mouth (Sjögren\'s)','Tertiary amine; sweating is a common effect'],
 ['Cevimeline','Muscarinic agonist','Dry mouth (Sjögren\'s)','Similar to pilocarpine'],
 ['Carbachol','Muscarinic + nicotinic','Miosis in eye surgery, glaucoma','Rarely used systemically'],
 ['Methacholine','Muscarinic agonist','Bronchial challenge test for asthma','Diagnostic only'],
 ['Acetylcholine','Endogenous','Rarely used','Destroyed very quickly by AChE']]],
['h','Indirect-acting: cholinesterase inhibitors'],
['drugs',[
 ['Neostigmine','Reversible AChE inhibitor','Myasthenia gravis, post-op ileus, reversal of non-depolarising blockers','Quaternary: no CNS entry'],
 ['Pyridostigmine','Reversible AChE inhibitor','Myasthenia gravis (long-term)','Quaternary'],
 ['Edrophonium','Reversible, very short','Diagnosing myasthenia gravis (Tensilon test)','Lasts minutes'],
 ['Physostigmine','Reversible, tertiary','Anticholinergic (atropine) toxicity','Crosses the blood-brain barrier'],
 ['Donepezil, rivastigmine, galantamine','Central AChE inhibitors','Alzheimer\'s disease','Nausea, bradycardia'],
 ['Echothiophate','Irreversible','Glaucoma (rare)','Organophosphate'],

</script><script>const $=s=>document.querySelector(s);const app=$('#app');
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done=store.get('done',{}),scores=store.get('scores',{});
const avail=n=>!!CH[n];
function strip(h){return h.replace(/<[^>]+>/g,'')}
function renderHome(){
 const total=TOC.length,dn=Object.keys(done).length,ready=Object.keys(CH).length;
 let h=`<section class="hero"><div class="pill">Pharmacology made simple</div><h1>Pharmacology</h1><p>Short explanations, diagrams, drugs grouped by active ingredient, Arabic notes, and review questions for every chapter.</p>
 <div class="stat"><div><b>${ready}</b><span>chapters ready</span></div><div><b>${total-ready}</b><span>coming next</span></div><div><b>${dn}</b><span>completed</span></div></div></section>
 <div class="search"><input id="q" type="search" placeholder="Search a drug or topic (e.g. atropine, β-blocker)" autocomplete="off"><div id="res"></div></div>`;
 PARTS.forEach((p,i)=>{const items=TOC.filter(t=>t[1]===i);
  h+=`<details class="part" ${i<2?'open':''}><summary><span class="pn">Part ${p.n}</span><span class="pt">${p.t}<small>${p.ar}</small></span></summary>`;
  items.forEach(t=>{const ok=avail(t[0]);h+=`<a class="chrow ${ok?'':'soon'}" href="#/ch/${t[0]}"><span class="num">${t[0]}</span><span class="nm">${t[2]}<small>Book p. ${t[3]}</small></span>${done[t[0]]?'<span class="ck">✓</span>':ok?'<span class="go">›</span>':'<span class="tag">Soon</span>'}</a>`});
  h+='</details>'});
 h+=`<p class="note">Educational use only. This app is a study aid, not medical advice. Check doses and indications against your textbook, formulary or local guidelines. Chapters 8 to 43 are being added in order.</p>`;
 app.innerHTML=h;
 $('#q').addEventListener('input',e=>search(e.target.value));
}
function search(v){v=v.trim().toLowerCase();const r=$('#res');if(v.length<2){r.innerHTML='';return}
 const out=[];
 TOC.forEach(t=>{if(t[2].toLowerCase().includes(v))out.push(`<a href="#/ch/${t[0]}"><b>Ch ${t[0]}</b> ${t[2]}</a>`)});
 Object.keys(CH).forEach(n=>CH[n].blocks.forEach(b=>{
  if(b[0]==='drugs')b[1].forEach(d=>{if(strip(d.join(' ')).toLowerCase().includes(v))out.push(`<a href="#/ch/${n}"><b>${strip(d[0])}</b><small>${d[1]} · ${d[2]} · Ch ${n}</small></a>`)});
  if(b[0]==='table')b[2].forEach(d=>{if(strip(d.join(' ')).toLowerCase().includes(v))out.push(`<a href="#/ch/${n}"><b>${strip(d[0])}</b><small>${strip(d.slice(1).join(' · '))} · Ch ${n}</small></a>`)});
 }));
 r.innerHTML=out.slice(0,12).join('')||'<p class="empty">No match yet. More chapters are on the way.</p>'}
function block(b){switch(b[0]){
 case 'h':return `<h2>${b[1]}</h2>`;
 case 'p':return `<p>${b[1]}</p>`;
 case 'svg':return `<figure>${D[b[1]]}<figcaption>${b[2]}</figcaption></figure>`;
 case 'tip':return `<div class="box tip"><b>Good to know</b>${b[1]}</div>`;
 case 'mn':return `<div class="box mn"><b>Memory trick</b>${b[1]}</div>`;
 case 'ar':return `<div class="box ar" dir="rtl" lang="ar"><b>ملحوظات</b>${b[1]}</div>`;
 case 'table':return `<div class="tw"><table><thead><tr>${b[1].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${b[2].map(r=>`<tr>${r.map((c,i)=>`<td data-l="${b[1][i]}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 case 'drugs':return `<div class="drugs">${b[1].map(d=>`<div class="drug"><div class="dn">${d[0]}</div><div class="dc">${d[1]}</div><div class="du"><b>Use:</b> ${d[2]}</div><div class="dx">${d[3]}</div></div>`).join('')}</div>`}}
function renderCh(n){
 const t=TOC.find(x=>x[0]===n);if(!t){location.hash='#/';return}
 const prev=n>1?`<a class="nav" href="#/ch/${n-1}">‹ Chapter ${n-1}</a>`:'<span></span>',next=n<43?`<a class="nav" href="#/ch/${n+1}">Chapter ${n+1} ›</a>`:'<span></span>';
 let h=`<a class="back" href="#/">‹ Contents</a><div class="chead"><span>Part ${PARTS[t[1]].n} · Chapter ${n} · Book p. ${t[3]}</span><h1>${t[2]}</h1></div>`;
 const c=CH[n];
 if(!c){h+=`<div class="soonbox"><div class="big">🚧</div><h2>This chapter is coming next</h2><p>It is on the contents list and will be filled in with the same format: simple explanation, diagrams, drug tables and review questions.</p></div><nav class="navrow">${prev}${next}</nav>`;app.innerHTML=h;window.scrollTo(0,0);return}
 h+=`<p class="lead">${c.intro}</p>`+c.blocks.map(block).join('');
 h+=`<h2 class="qh">Review questions</h2><div id="quiz">${c.q.map((q,i)=>`<div class="q" data-i="${i}"><p><b>${i+1}.</b> ${q[0]}</p>${q[1].map((o,j)=>`<button data-j="${j}">${o}</button>`).join('')}<div class="ex"></div></div>`).join('')}<div id="score" class="score">${scores[n]!=null?'Last score: '+scores[n]+' / '+c.q.length:''}</div></div>`;
 h+=`<button class="donebtn ${done[n]?'on':''}" id="dbtn">${done[n]?'✓ Completed':'Mark chapter as completed'}</button><nav class="navrow">${prev}${next}</nav>`;
 app.innerHTML=h;window.scrollTo(0,0);
 let got=0,ans=0;
 document.querySelectorAll('.q').forEach(qe=>{const q=c.q[+qe.dataset.i];qe.querySelectorAll('button').forEach(bt=>bt.onclick=()=>{
  if(qe.dataset.d)return;qe.dataset.d=1;ans++;const j=+bt.dataset.j;
  qe.querySelectorAll('button')[q[2]].classList.add('ok');if(j===q[2])got++;else bt.classList.add('bad');
  qe.querySelector('.ex').textContent=(j===q[2]?'Correct. ':'Not quite. ')+q[3];
  if(ans===c.q.length){scores[n]=got;store.set('scores',scores);$('#score').textContent='Score: '+got+' / '+c.q.length}})});
 $('#dbtn').onclick=()=>{if(done[n])delete done[n];else done[n]=1;store.set('done',done);renderCh(n)};
}
function route(){const m=location.hash.match(/^#\/ch\/(\d+)/);if(m)renderCh(+m[1]);else{renderHome();window.scrollTo(0,0)}}
addEventListener('hashchange',route);route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
